<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Seminar Registration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>IT Seminar Registration</h1>

    <form id="registrationForm" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" required aria-invalid="false" aria-describedby="fullNameError">
        <p id="fullNameError" class="error"></p>
      </div>

      <div class="field">
        <label for="studentNumber">Student number</label>
        <input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" required aria-invalid="false" aria-describedby="studentNumberError">
        <p id="studentNumberError" class="error"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required aria-invalid="false" aria-describedby="emailError">
        <p id="emailError" class="error"></p>
      </div>

      <div class="field">
        <label for="mobileNumber">Mobile number</label>
        <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="09123456789" required aria-invalid="false" aria-describedby="mobileNumberError">
        <p id="mobileNumberError" class="error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required aria-invalid="false" aria-describedby="passwordError passwordFeedback">
        <p id="passwordFeedback" class="feedback" aria-live="polite"></p>
        <p id="passwordError" class="error"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required aria-invalid="false" aria-describedby="confirmPasswordError">
        <p id="confirmPasswordError" class="error"></p>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course" required aria-invalid="false" aria-describedby="courseError">
          <option value="" selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <p id="courseError" class="error"></p>
      </div>

      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="terms" name="terms" required aria-invalid="false" aria-describedby="termsError">
          <label for="terms">I agree to the terms and conditions</label>
        </div>
        <p id="termsError" class="error"></p>
      </div>

      <div class="buttons">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <p id="successMessage" class="success" role="status"></p>

    <section id="registrationSummary" class="summary" hidden>
      <h2>Registration Summary</h2>
      <ul>
        <li>Full name: <span id="summaryName"></span></li>
        <li>Student number: <span id="summaryStudentNumber"></span></li>
        <li>Email: <span id="summaryEmail"></span></li>
        <li>Mobile number: <span id="summaryMobileNumber"></span></li>
        <li>Course: <span id="summaryCourse"></span></li>
      </ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
